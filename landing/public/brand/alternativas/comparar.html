<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spot · alternativas de logo</title>
<style>
body{margin:0;font:14px/1.5 system-ui,sans-serif;background:#f3f5fa;color:#0a0a0b}
h1{font-size:18px;margin:24px}
.row{display:grid;grid-template-columns:200px 1fr 1fr 160px;align-items:center;gap:0;border-top:1px solid #dde1ea}
.row>div{padding:28px 24px;display:flex;align-items:center;justify-content:center;gap:16px;min-height:120px}
.n{justify-content:flex-start!important;font-weight:600}.n small{display:block;font-weight:400;color:#4b4e5a}
.l{background:#fff}.d{background:#0a0a0b}.i{background:#e7e9ef}
img.lk{height:56px}@media(max-width:800px){.row{grid-template-columns:1fr}}
</style>
<h1>Spot · logo atual e 3 alternativas</h1>
<div class="row"><div class="n"><span>Atual: Grade<small>o ponto azul é o horário escolhido na escala</small></span></div><div class="l"><img class="lk" src="../spot-logo.svg"></div><div class="d"><img class="lk" src="../spot-logo-branco.svg"></div><div class="i"><img src="../spot-icon-pequeno.svg" width="48"><img src="../spot-icon-pequeno.svg" width="16"></div></div>
<div class="row"><div class="n"><span>1 · Encaixe<small>um horário vazio recebe o ponto azul</small></span></div><div class="l"><img class="lk" src="spot-alt1-encaixe.svg"></div><div class="d"><img class="lk" src="spot-alt1-encaixe-branco.svg"></div><div class="i"><img src="spot-alt1-encaixe-icone.svg" width="48"><img src="spot-alt1-encaixe-icone.svg" width="16"></div></div>
<div class="row"><div class="n"><span>2 · Ponteiro<small>o ponteiro do relógio termina no ponto</small></span></div><div class="l"><img class="lk" src="spot-alt2-ponteiro.svg"></div><div class="d"><img class="lk" src="spot-alt2-ponteiro-branco.svg"></div><div class="i"><img src="spot-alt2-ponteiro-icone.svg" width="48"><img src="spot-alt2-ponteiro-icone.svg" width="16"></div></div>
<div class="row"><div class="n"><span>3 · Pino<small>o lugar certo, com a agenda dentro</small></span></div><div class="l"><img class="lk" src="spot-alt3-pino.svg"></div><div class="d"><img class="lk" src="spot-alt3-pino-branco.svg"></div><div class="i"><img src="spot-alt3-pino-icone.svg" width="48"><img src="spot-alt3-pino-icone.svg" width="16"></div></div>
